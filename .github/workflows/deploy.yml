name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure canonical origin and base path
        env:
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -n "$CUSTOM_SITE_URL" ]]; then
            echo "NUXT_PUBLIC_SITE_URL=${CUSTOM_SITE_URL%/}" >> "$GITHUB_ENV"
            echo "NUXT_APP_BASE_URL=/" >> "$GITHUB_ENV"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "NUXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "NUXT_APP_BASE_URL=/" >> "$GITHUB_ENV"
          else
            echo "NUXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
            echo "NUXT_APP_BASE_URL=/${REPO}/" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm run generate

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
